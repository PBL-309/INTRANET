<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="csrf-token" content="{{ csrf_token() }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#172033;background:#fff}.chat{height:100%;display:grid;grid-template-rows:58px 1fr}.head{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(110deg,#5f0d1b,#8b1528);color:#fff}.brand{display:flex;align-items:center;gap:10px}.brand i{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#ffffff1f}.brand strong,.brand small{display:block}.brand small{font-size:11px;opacity:.72}.close{width:38px;height:38px;border:0;border-radius:10px;background:#ffffff18;color:#fff;font-size:18px}.layout{display:grid;grid-template-columns:250px 1fr;min-height:0}.sidebar{display:flex;flex-direction:column;min-height:0;background:#f7f8fa;border-right:1px solid #e5e9ed}.search{padding:12px}.search input{width:100%;padding:10px;border:1px solid #d7dee4;border-radius:10px;font-size:16px;outline:none}.list{flex:1;overflow:auto}.label{padding:5px 12px;color:#7a8795;font-size:10px;font-weight:800;text-transform:uppercase}.contact{width:100%;display:flex;align-items:center;gap:9px;padding:10px 11px;border:0;border-bottom:1px solid #e9edf0;background:transparent;text-align:left}.contact.active{background:#fff;box-shadow:inset 3px 0 #8b1528}.avatar{flex:0 0 38px;height:38px;display:grid;place-items:center;overflow:hidden;border-radius:12px;background:#d8e1e8;font-size:11px;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.ct{min-width:0;flex:1}.ct strong,.ct small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct strong{font-size:12px}.ct small{margin-top:2px;color:#778492;font-size:10px}.main{display:grid;grid-template-rows:50px 1fr auto;min-width:0;min-height:0}.person{display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid #e9edf0}.person strong,.person small{display:block}.person strong{font-size:13px}.person small{font-size:10px;color:#758290}.back{display:none;width:34px;height:34px;border:0;border-radius:9px;background:#eef2f5}.messages{min-height:0;overflow:auto;padding:14px;background:#f7f9fa}.empty{height:100%;display:grid;place-items:center;padding:25px;text-align:center;color:#7b8794}.row{display:flex;margin-bottom:8px}.row.own{justify-content:flex-end}.message{max-width:78%;padding:8px 10px;border:1px solid #e1e6ea;border-radius:12px 12px 12px 3px;background:#fff;font-size:12px;line-height:1.35;white-space:pre-wrap;word-break:break-word}.own .message{border-color:#8b1528;border-radius:12px 12px 3px 12px;background:#8b1528;color:#fff}.time{display:block;margin-top:4px;text-align:right;color:#87929d;font-size:9px}.own .time{color:#ffffffb3}.compose{display:flex;align-items:flex-end;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #e5e9ed}.compose textarea{flex:1;min-width:0;min-height:44px;max-height:90px;padding:10px;border:1px solid #d5dce2;border-radius:11px;resize:none;font-size:16px;outline:none}.compose button{flex:0 0 46px;width:46px;height:44px;border:0;border-radius:11px;background:#8b1528;color:#fff}.error{display:none;padding:7px 10px;background:#f9e2e5;color:#8b1528;font-size:11px}@media(max-width:680px){.layout{grid-template-columns:1fr}.main{display:none}.chat.open .sidebar{display:none}.chat.open .main{display:grid}.back{display:grid;place-items:center}.messages{overscroll-behavior:contain}}
</style></head><body><section class="chat" id="chat"><header class="head"><div class="brand"><i class="bi bi-chat-square-text-fill"></i><div><strong>Chat interno</strong><small>Comunicación entre el personal</small></div></div><button class="close" id="close"><i class="bi bi-x-lg"></i></button></header><div class="layout"><aside class="sidebar"><div class="search"><input id="search" placeholder="Buscar persona o nómina" autocomplete="off"></div><div class="list" id="list"><div class="empty">Cargando personal…</div></div></aside><main class="main"><div class="person" id="person"><button class="back" id="back"><i class="bi bi-arrow-left"></i></button><div><strong>Selecciona una persona</strong><small>para iniciar una conversación</small></div></div><div class="messages" id="messages"><div class="empty">Elige una persona para comenzar.</div></div><div class="error" id="error"></div><form class="compose" id="compose" hidden><textarea id="input" maxlength="1000" rows="1" placeholder="Escribe un mensaje…"></textarea><button><i class="bi bi-send-fill"></i></button></form></main></div></section><script>
const chat=document.querySelector('#chat'),list=document.querySelector('#list'),search=document.querySelector('#search'),person=document.querySelector('#person'),messages=document.querySelector('#messages'),compose=document.querySelector('#compose'),input=document.querySelector('#input'),error=document.querySelector('#error'),csrf=document.querySelector('meta').content;let active=null,timer=null,last=null;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),avatar=c=>c.foto_url?`<img src="${esc(c.foto_url)}">`:esc(c.iniciales),fail=t=>{error.textContent=t;error.style.display=t?'block':'none'},button=c=>`<button class="contact ${active?.id===c.id?'active':''}" data-user='${esc(JSON.stringify(c))}'><span class="avatar">${avatar(c)}</span><span class="ct"><strong>${esc(c.nombre)}</strong><small>${esc(c.ultimo_mensaje||('Nómina '+c.username))}</small></span></button>`;function bind(){list.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>select(JSON.parse(b.dataset.user)))}async function conversations(){try{const d=await fetch('/api/chat/conversaciones').then(r=>r.json());if(!search.value.trim()){list.innerHTML=d.conversaciones.length?'<div class="label">Conversaciones recientes</div>'+d.conversaciones.map(button).join(''):'<div class="empty">Busca una persona para comenzar.</div>';bind();parent.postMessage({type:'intranet-chat-unread',count:d.no_leidos},location.origin)}}catch(e){}}async function users(q){const d=await fetch('/api/chat/usuarios?q='+encodeURIComponent(q)).then(r=>r.json());list.innerHTML=d.length?'<div class="label">Personal</div>'+d.map(button).join(''):'<div class="empty">Sin resultados.</div>';bind()}async function select(c){active=c;chat.classList.add('open');person.innerHTML=`<button class="back" id="db"><i class="bi bi-arrow-left"></i></button><span class="avatar">${avatar(c)}</span><div><strong>${esc(c.nombre)}</strong><small>Nómina ${esc(c.username)}</small></div>`;document.querySelector('#db').onclick=()=>{input.blur();chat.classList.remove('open')};compose.hidden=false;if(innerWidth<=680)input.blur();else input.focus();await load(true);conversations()}async function load(force=false){if(!active)return;try{const d=await fetch('/api/chat/mensajes/'+active.id).then(r=>r.json()),newest=d.mensajes.at(-1)?.id||null;if(force||newest!==last){messages.innerHTML=d.mensajes.length?d.mensajes.map(m=>`<div class="row ${m.propio?'own':''}"><div class="message">${esc(m.contenido)}<span class="time">${esc(m.fecha)}${m.propio&&m.leido?' · Leído':''}</span></div></div>`).join(''):'<div class="empty">Aún no hay mensajes.</div>';messages.scrollTop=messages.scrollHeight;last=newest}fail('')}catch(e){fail('No fue posible cargar la conversación.')}}compose.onsubmit=async e=>{e.preventDefault();const contenido=input.value.trim();if(!contenido||!active)return;input.disabled=true;try{const r=await fetch('/api/chat/mensajes',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify({destinatario_id:active.id,contenido})}),d=await r.json();if(!r.ok)throw Error(d.error);input.value='';last=null;await load(true);conversations()}catch(e){fail(e.message)}finally{input.disabled=false;input.focus()}};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();compose.requestSubmit()}};search.oninput=()=>{clearTimeout(timer);const q=search.value.trim();timer=setTimeout(()=>q?users(q):conversations(),220)};document.querySelector('#back').onclick=()=>chat.classList.remove('open');document.querySelector('#close').onclick=()=>parent.postMessage({type:'intranet-chat-close'},location.origin);conversations();setInterval(()=>{conversations();if(active)load()},5000);
</script><script>
load=async function(force=false){if(!active)return;try{const d=await fetch('/api/chat/mensajes/'+active.id).then(r=>r.json()),newest=d.mensajes.at(-1)?.id||null;if(force||newest!==last){messages.innerHTML=d.mensajes.length?d.mensajes.map(m=>`<div class="row ${m.propio?'own':''}"><div class="message">${esc(m.contenido)}<span class="time">${esc(m.fecha)}${m.editado?' · Editado':''}${m.propio&&m.leido?' · Leído':''}</span>${m.propio?`<span style="display:flex;justify-content:flex-end;gap:4px;margin-top:5px"><button data-edit="${m.id}" data-text="${esc(m.contenido)}">Editar</button><button data-delete="${m.id}">Eliminar</button></span>`:''}</div></div>`).join(''):'<div class="empty">Aún no hay mensajes.</div>';messages.scrollTop=messages.scrollHeight;last=newest;bindActions()}fail('')}catch(e){fail('No fue posible cargar la conversación.')}};
async function changeMessage(id,method,body){const r=await fetch('/api/chat/mensajes/'+id,{method,headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:body?JSON.stringify(body):null}),d=await r.json();if(!r.ok)throw Error(d.error);last=null;await load(true);conversations()}
function bindActions(){messages.querySelectorAll('[data-edit]').forEach(edit=>{const menu=edit.parentElement;menu.style.cssText='display:none;position:absolute;right:3px;top:25px;z-index:8;padding:4px;border:1px solid #ddd;border-radius:8px;background:#fff';const toggle=document.createElement('button');toggle.textContent='⌄';toggle.style.cssText='position:absolute;right:3px;top:2px;border:0;background:transparent;color:inherit';toggle.onclick=e=>{e.stopPropagation();messages.querySelectorAll('[data-action-menu]').forEach(x=>{if(x!==menu)x.style.display='none'});menu.style.display=menu.style.display==='block'?'none':'block'};menu.dataset.actionMenu='';edit.closest('.message').append(toggle);edit.onclick=async()=>{const contenido=prompt('Editar mensaje:',edit.dataset.text);if(contenido!==null)try{await changeMessage(edit.dataset.edit,'PUT',{contenido})}catch(e){fail(e.message)}}});messages.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar este mensaje?'))try{await changeMessage(b.dataset.delete,'DELETE')}catch(e){fail(e.message)}})}
const baseConversations=conversations;conversations=async function(){await baseConversations();list.querySelectorAll('[data-user]').forEach(button=>{const contact=JSON.parse(button.dataset.user);if(contact.conectado){const avatarEl=button.querySelector('.avatar');avatarEl.style.position='relative';avatarEl.insertAdjacentHTML('beforeend','<span data-live-dot style="position:absolute;right:1px;bottom:1px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#24b45a"></span>')}})};const baseSelect=select;select=async function(contact){await baseSelect(contact);const small=person.querySelector('small');if(small)small.textContent=(contact.conectado?'Conectado':'Desconectado')+' · Nómina '+contact.username;if(contact.conectado){const avatarEl=person.querySelector('.avatar');avatarEl.style.position='relative';avatarEl.insertAdjacentHTML('beforeend','<span data-live-dot style="position:absolute;right:1px;bottom:1px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#24b45a"></span>')}};
async function refreshActivePresence(){if(!active)return;try{const users=await fetch('/api/chat/usuarios?q='+encodeURIComponent(active.username)).then(r=>r.json()),fresh=users.find(user=>user.id===active.id);if(!fresh)return;active={...active,...fresh};const small=person.querySelector('small');if(small)small.textContent=(active.conectado?'Conectado':'Desconectado')+' · Nómina '+active.username;const avatarEl=person.querySelector('.avatar');if(avatarEl){const dot=avatarEl.querySelector('[data-live-dot]');if(active.conectado&&!dot)avatarEl.insertAdjacentHTML('beforeend','<span data-live-dot style="position:absolute;right:1px;bottom:1px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#24b45a"></span>');if(!active.conectado&&dot)dot.remove()}}catch(e){}}setInterval(refreshActivePresence,5000);
</script></body></html>
