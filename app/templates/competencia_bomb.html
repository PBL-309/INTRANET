<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Bombero Challenge</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --secondary: #1976d2;
            --success: #2e7d32;
            --bg: #f4f7fb;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 45%, #dc2626 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }
        .wrapper { max-width: 760px; margin: 0 auto; }
        .card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 36px 30px;
            text-align: center;
        }
        .hero i { font-size: 3rem; margin-bottom: 12px; display: inline-block; }
        .hero h1 { margin: 0 0 8px; font-size: 2rem; }
        .hero p { margin: 0; opacity: 0.95; }
        .body { padding: 32px 30px 28px; }
        .alert {
            display: flex; gap: 12px; align-items: flex-start;
            background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a;
            padding: 14px 16px; border-radius: 12px; margin-bottom: 24px;
        }
        .section-title {
            display: flex; justify-content: space-between; align-items: center;
            margin: 24px 0 12px; font-weight: 700; color: var(--text);
        }
        .section-title span { display: flex; align-items: center; gap: 8px; }
        .section-title span i { color: var(--primary); }
        .grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .field { display: flex; flex-direction: column; gap: 7px; }
        .field.full { grid-column: 1 / -1; }
        label { font-weight: 600; font-size: 0.96rem; }
        input, select {
            border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 1rem;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        input:focus, select:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.14);
        }
        .hint { font-size: 0.85rem; color: var(--muted); }
        .actions { margin-top: 24px; }
        button {
            width: 100%; border: none; border-radius: 12px; padding: 14px 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem;
        }
        button:hover { transform: translateY(-1px); }
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; display: none; animation: spin 1s linear infinite; }
        button.loading .spinner { display: inline-block; }
        button.loading span { display: none; }
        .error { color: #c62828; font-size: 0.9rem; min-height: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .body { padding: 24px 20px 22px; }
            .hero { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="hero">
                <i class="fas fa-trophy"></i>
                <h1>Bombero Challenge</h1>
                <p>Registra tu participación y recibe tu número de competidor</p>
            </div>
            <div class="body">
                <div class="alert">
                    <i class="fas fa-info-circle"></i>
                    <div>
                        Completa tus datos para confirmar tu inscripción. En breve recibirás un correo con tu número de competidor y la confirmación de participación.
                    </div>
                </div>

                <form id="competencia-form" method="POST" action="{{ url_for('main.submit_competencia') }}" novalidate>
                    <div class="section-title">
                        <span><i class="fas fa-user"></i> Datos del participante</span>
                    </div>
                    <div class="grid">
                        <div class="field full">
                            <label for="nombre">Nombre completo</label>
                            <input id="nombre" name="nombre" type="text" value="{{ current_user.nombre }}" required>
                        </div>
                        <div class="field">
                            <label for="nomina">Nómina</label>
                            <input id="nomina" name="nomina" type="text" value="{{ current_user.username }}" required>
                        </div>
                        <div class="field">
                            <label for="turno">Turno</label>
                            <select id="turno" name="turno" required>
                                <option value="">Selecciona</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="GENERAL">GENERAL</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="categoria">Categoría</label>
                            <select id="categoria" name="categoria" required>
                                <option value="">Selecciona</option>
                                <option value="Individual">Individual</option>
                                <option value="Parejas">Parejas</option>
                                <option value="Equipo">Equipo</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="ninos">Niños</label>
                            <input id="ninos" name="ninos" type="number" min="0" value="0" required>
                        </div>
                        <div class="field">
                            <label for="adultos">Adultos</label>
                            <input id="adultos" name="adultos" type="number" min="0" value="0" required>
                        </div>
                        <div class="field full">
                            <label for="correo">Correo electrónico</label>
                            <input id="correo" name="correo" type="email" placeholder="tu.correo@ejemplo.com" required>
                            <div class="hint">Tu número de competidor se enviará a este correo.</div>
                            <div class="error" id="correo-error"></div>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" id="submit-btn">
                            <span><i class="fas fa-paper-plane"></i> Confirmar inscripción</span>
                            <div class="spinner"></div>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('competencia-form');
        const correo = document.getElementById('correo');
        const correoError = document.getElementById('correo-error');
        const submitBtn = document.getElementById('submit-btn');

        function validarCorreo() {
            if (!correo.value) {
                correoError.textContent = 'Ingresa un correo electrónico.';
                return false;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo.value)) {
                correoError.textContent = 'El correo no tiene un formato válido.';
                return false;
            }
            correoError.textContent = '';
            return true;
        }

        correo.addEventListener('input', validarCorreo);

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (!validarCorreo()) return;
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            form.submit();
        });
    </script>
</body>
</html>
