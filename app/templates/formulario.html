<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Datos de Emergencia</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f6fa;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.form-container{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    max-width:700px;
    width:100%;
}

.question{
    background:#eef6ff;
    border:1px solid #cfe2ff;
    padding:20px;
    border-radius:10px;
    margin-bottom:25px;
    font-weight:600;
    color:#1d3557;
}

.radio-group{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.radio-group input{
    display:none;
}

.radio-group label{
    padding:8px 14px;
    border-radius:20px;
    border:1px solid #ccc;
    cursor:pointer;
    background:#f8f9fa;
    transition:.25s;
}

.radio-group label:hover{
    background:#e2e6ea;
}

.radio-group input:checked + label{
    background:#90caf9;
    border-color:#42a5f5;
    font-weight:bold;
}

input[type=text]{
    margin-top:10px;
}

.btn-custom{
    background:#1976d2;
    color:white;
    border:none;
    padding:10px 25px;
    border-radius:6px;
    font-weight:bold;
}

.btn-custom:hover{
    background:#0d47a1;
}

</style>
</head>


<body>

<div class="form-container">

<h3 class="text-center mb-4">Registro de Contacto de Emergencia</h3>

<form method="POST" action="{{ url_for('main.guardar_contacto') }}">
    {{ csrf_token() }}

    <!-- Nombre -->
    <div class="question">
    Nombre del contacto de emergencia *
    <input type="text" name="nombre_contacto"
    class="form-control" required
    pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$"
    title="Solo se permiten letras y espacios"
    data-letters-only>
    </div>


<!-- Parentesco -->
<div class="question">
Parentesco con el contacto *

<div class="radio-group">

<input type="radio" id="padre"
name="parentesco" value="Padre" required>
<label for="padre">Padre</label>

<input type="radio" id="madre"
name="parentesco" value="Madre">
<label for="madre">Madre</label>

<input type="radio" id="esposo"
name="parentesco" value="Esposo(a)">
<label for="esposo">Esposo(a)</label>

<input type="radio" id="hermano"
name="parentesco" value="Hermano(a)">
<label for="hermano">Hermano(a)</label>

<input type="radio" id="otro"
name="parentesco" value="Otro">
<label for="otro">Otro</label>

</div>

<input type="text"
name="otro_parentesco"
id="otro_parentesco"
class="form-control mt-2"
placeholder="Especificar si seleccionó 'Otro'"
pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$"
title="Solo se permiten letras y espacios"
data-letters-only>

</div>


<!-- Teléfono -->
<div class="question">
Contacto de emergencia (número completo de celular) *

<input type="tel"
name="telefono_contacto"
class="form-control"
maxlength="10"
inputmode="numeric"
pattern="^[0-9]{10}$"
title="Ingrese exactamente 10 dígitos"
required>

</div>


<!-- Calle -->
<div class="question">
Calle y número del domicilio del contacto de emergencia *

<input type="text"
name="calle_numero"
class="form-control"
required
pattern="^[A-Za-z0-9ÁÉÍÓÚáéíóúÑñ\s\.\-#]+$"
title="Solo letras, números, espacios y . - #">

</div>


<!-- Colonia -->
<div class="question">
Colonia del domicilio del contacto de emergencia *

<input type="text"
name="colonia"
class="form-control"
required
pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s]+$"
title="Solo letras, números y espacios">

</div>


<div class="text-center mt-4">
<button type="submit"
class="btn-custom">
Guardar información
</button>
</div>

</form>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const otroRadio = document.getElementById('otro');
        const otroInput = document.getElementById('otro_parentesco');
        const parentescoRadios = document.querySelectorAll('input[name="parentesco"]');

        function toggleOtro() {
            otroInput.required = otroRadio.checked;
            if (!otroRadio.checked) {
                otroInput.value = '';
            }
        }

        parentescoRadios.forEach(function(radio) {
            radio.addEventListener('change', toggleOtro);
        });

        toggleOtro();

        const telefono = document.querySelector('input[name="telefono_contacto"]');
        telefono.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 10);
        });

        document.querySelectorAll('input[data-letters-only]').forEach(function(input) {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ\s]/g, '');
            });
        });
    });
</script>

</body>
</html>
